<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Optimal Route Finder using A* Algorithm</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:
    radial-gradient(circle at top left,#2563eb 0%,transparent 30%),
    radial-gradient(circle at bottom right,#06b6d4 0%,transparent 30%),
    linear-gradient(135deg,#020617,#0f172a);

    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{

    width:100%;
    max-width:1350px;

    background:rgba(17,24,39,0.95);

    border-radius:25px;

    overflow:hidden;

    display:flex;

    box-shadow:0 0 30px rgba(0,0,0,0.5);

    border:1px solid rgba(255,255,255,0.08);
}

/* LEFT PANEL */

.left{

    width:35%;

    padding:40px;

    background:rgba(15,23,42,0.95);

    border-right:1px solid rgba(255,255,255,0.08);
}

.logo{

    font-size:34px;

    font-weight:700;

    color:#38bdf8;

    margin-bottom:12px;
}

.subtitle{

    color:#cbd5e1;

    margin-bottom:35px;

    line-height:1.6;
}

.input-group{

    margin-bottom:25px;
}

label{

    display:block;

    margin-bottom:10px;

    color:#cbd5e1;
}

select{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#1e293b;

    color:white;

    font-size:16px;

    outline:none;
}

button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:12px;

    background:#38bdf8;

    color:black;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;

    margin-top:10px;
}

button:hover{

    transform:translateY(-3px);

    background:#0ea5e9;
}

.result{

    margin-top:35px;

    background:#111827;

    padding:25px;

    border-radius:18px;
}

.result h2{

    margin-bottom:20px;

    color:#38bdf8;
}

.result-item{

    background:#1e293b;

    padding:15px;

    border-radius:12px;

    margin-bottom:15px;

    color:#e2e8f0;
}

/* RIGHT PANEL */

.right{

    flex:1;

    position:relative;

    background:#081120;

    overflow:hidden;
}

svg{

    width:100%;

    height:100%;
}

.city{

    fill:#38bdf8;

    stroke:white;

    stroke-width:3;

    transition:0.3s;
}

.city:hover{

    fill:#22c55e;
}

.city-label{

    fill:white;

    font-size:14px;
}

.route{

    stroke:#475569;

    stroke-width:4;
}

.active{

    stroke:#22c55e;

    stroke-width:6;

    filter:drop-shadow(0 0 8px #22c55e);
}

.legend{

    position:absolute;

    bottom:20px;

    left:20px;

    background:#111827;

    padding:15px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,0.08);
}

.legend p{

    margin-bottom:8px;

    font-size:14px;
}

.header{

    position:absolute;

    top:20px;

    right:20px;

    background:#111827;

    padding:12px 20px;

    border-radius:12px;

    font-size:14px;

    border:1px solid rgba(255,255,255,0.08);
}

@media(max-width:950px){

    .container{

        flex-direction:column;
    }

    .left{

        width:100%;
    }

    .right{

        height:650px;
    }
}

</style>
</head>

<body>

<!-- LEFT PANEL -->

AI-Based Optimal Route Finder between cities using
the A* Search Algorithm.

<option>Lucknow</option>

<script>

const graph = {

    Bangalore:{
        Chennai:350,
        Hyderabad:570,
        Goa:560,
        Kochi:550
    },

    Chennai:{
        Bangalore:350,
        Hyderabad:630,
        Kolkata:1670,
        Kochi:690
    },

    Hyderabad:{
        Bangalore:570,
        Chennai:630,
        Pune:560,
        Bhopal:780
    },

    Pune:{
        Hyderabad:560,
        Mumbai:150
    },

    Mumbai:{
        Pune:150,
        Delhi:1450,
        Ahmedabad:530,
        Goa:590
    },

    Delhi:{
        Mumbai:1450,
        Kolkata:1500,
        Jaipur:280,
        Lucknow:550,
        Ahmedabad:950,
        Bhopal:740
    },

    Kolkata:{
        Delhi:1500,
        Chennai:1670,
        Lucknow:980
    },

    Ahmedabad:{
        Mumbai:530,
        Delhi:950,
        Jaipur:660
    },

    Jaipur:{
        Delhi:280,
        Ahmedabad:660
    },

    Goa:{
        Bangalore:560,
        Mumbai:590
    },

    Kochi:{
        Bangalore:550,
        Chennai:690
    },

    Bhopal:{
        Delhi:740,
        Hyderabad:780
    },

    Lucknow:{
        Delhi:550,
        Kolkata:980
    }
};

function heuristic(){
    return 1;
}

function aStar(start,goal){

    let openSet = [{
        city:start,
        distance:0,
        path:[start]
    }];

    let visited = new Set();

    while(openSet.length > 0){

        openSet.sort((a,b)=>
            a.distance - b.distance
        );

        let current = openSet.shift();

        if(current.city === goal){
            return current;
        }

        visited.add(current.city);

        for(let neighbor in graph[current.city]){

            if(!visited.has(neighbor)){

                openSet.push({

                    city:neighbor,

                    distance:
                    current.distance +
                    graph[current.city][neighbor] +
                    heuristic(),

                    path:[
                        ...current.path,
                        neighbor
                    ]
                });
            }
        }
    }

    return null;
}

function clearRoutes(){

    document.querySelectorAll(".route")
    .forEach(route=>{

        route.classList.remove("active");
    });
}

function activateRoute(a,b){

    let id1 = `${a}-${b}`;
    let id2 = `${b}-${a}`;

    let line =
    document.getElementById(id1) ||
    document.getElementById(id2);

    if(line){
        line.classList.add("active");
    }
}

function findRoute(){

    clearRoutes();

    const source =
    document.getElementById("source").value;

    const destination =
    document.getElementById("destination").value;

    if(source === destination){

        alert("Please select different cities");
        return;
    }

    const result =
    aStar(source,destination);

    if(result){

        document.getElementById("route")
        .innerText =
        result.path.join(" → ");

        document.getElementById("distance")
        .innerText =
        result.distance + " km";

        document.getElementById("cost")
        .innerText =
        Math.floor(result.distance / 50);

        for(let i=0;
            i<result.path.length-1;
            i++){

            activateRoute(
                result.path[i],
                result.path[i+1]
            );
        }
    }
}

</script>
